<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #1f2328;
    }
    h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
      font-size: 12px;
    }
    input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 13px;
      box-sizing: border-box;
    }
    .hint {
      font-size: 11px;
      color: #656d76;
      margin: 4px 0 12px;
    }
    button {
      background-color: #2ea44f;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 16px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #2c974b;
    }
    .status {
      margin-top: 8px;
      font-size: 12px;
      color: #2ea44f;
      display: none;
    }
  </style>
</head>
<body>
  <h3>GitHub Radius Settings</h3>
  <label for="token">GitHub Personal Access Token</label>
  <input type="password" id="token" placeholder="ghp_..." />
  <div class="hint">Needs repo scope (issues, contents, pull requests).</div>
  <button id="save">Save Token</button>
  <div class="status" id="status">Token saved.</div>
  <script src="popup.js"></script>
</body>
</html>
